name: Deploy React Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'Deploy static site from main via GitHub Actions'

      - name: Configure GitHub Pages source to gh-pages
        if: ${{ secrets.GH_PAGES_TOKEN != '' }}
        env:
          PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          RESPONSE_FILE=$(mktemp)
          STATUS=$(curl -s -w '%{http_code}' -o "$RESPONSE_FILE" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAGES_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/$REPO/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')

          if [ "$STATUS" -eq 409 ]; then
            STATUS=$(curl -s -w '%{http_code}' -o "$RESPONSE_FILE" -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PAGES_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/$REPO/pages \
              -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')
          fi

          if [ "$STATUS" -ge 300 ]; then
            echo "GitHub Pages configuration failed with status $STATUS"
            cat "$RESPONSE_FILE"
            exit 1
          fi
          cat "$RESPONSE_FILE"
      - name: Skip GitHub Pages source configuration when token is absent
        if: ${{ secrets.GH_PAGES_TOKEN == '' }}
        run: |
          echo "GH_PAGES_TOKEN secret is not configured."
          echo "The gh-pages branch will still be published, but you must configure GitHub Pages source manually to use gh-pages/."